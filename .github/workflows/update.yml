name: 每日更新估值并按 gh-pages 发布

on:
  schedule:
    # 主更新：每个交易日（周一至周五）北京时间 18:30 = UTC 10:30。
    # 收盘 15:00，东财估值通常 16:00-17:00 后陆续更新；18:30 起跑，
    # 若数据源还没发布，workflow 会等 20 分钟再抓一次（见 check_fresh 步骤）。
    - cron: '30 10 * * 1-5'
    # 补跑：北京时间 08:07 = UTC 00:07，周二至周六，覆盖前一交易日。
    - cron: '7 0 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取数据（成分股 → 个股估值 → 分红 → 聚合）
        env:
          STOCK_WORKERS: '5'
        run: |
          for attempt in 1 2 3; do
            echo "::group::第 $attempt 次尝试"
            if python scripts/fetch_data.py; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "第 $attempt 次失败，等 60 秒后重试（境外访问国内数据源偶发连接重置）"
            sleep 60
            if [ "$attempt" = "3" ]; then
              echo "::error::三次尝试均失败"
              exit 1
            fi
          done

      - name: 检查数据是否已更新到最近交易日
        run: |
          # 东财的个股估值不一定在收盘后立刻发布；没更新就等 20 分钟再抓一次。
          if python scripts/check_fresh.py; then
            exit 0
          fi
          echo "::warning::数据源尚未发布最新交易日的数据，20 分钟后重试一次"
          sleep 1200
          python scripts/fetch_data.py || true
          if python scripts/check_fresh.py; then
            echo "重试后已拿到最新交易日数据"
          else
            echo "::warning::仍未拿到最新交易日数据（可能是节假日），按现有数据发布"
          fi

      - name: 数据健康检查
        run: python scripts/check_data.py

      - name: 生成站点时间戳
        run: |
          echo "build: $(date -u '+%Y-%m-%d %H:%M UTC')" > web/BUILD.txt
          cat web/BUILD.txt

      - name: 发布到 gh-pages
        run: |
          set -e
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r web/. /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q
          git checkout -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u '+%Y-%m-%d')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: 失败时告警
        if: failure()
        run: |
          echo "::error::数据更新失败，站点仍保留上一次成功发布的内容。"
