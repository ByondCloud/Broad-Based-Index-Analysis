name: 每日更新估值并按 gh-pages 发布

on:
  schedule:
    # 主更新：每个交易日（周一至周五）北京时间 21:13 = UTC 13:13。
    # 刻意避开整点：GitHub 调度器在 :00 最拥堵，延迟可达 30-60 分钟甚至更久。
    - cron: '13 13 * * 1-5'
    # 补跑：北京时间 08:07 = UTC 00:07，周二至周六，覆盖前一交易日。
    - cron: '7 0 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取数据（成分股 → 个股估值 → 分红 → 聚合）
        env:
          STOCK_WORKERS: '5'
        run: |
          for attempt in 1 2 3; do
            echo "::group::第 $attempt 次尝试"
            if python scripts/fetch_data.py; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "第 $attempt 次失败，等 60 秒后重试（境外访问国内数据源偶发连接重置）"
            sleep 60
          done
          echo "::error::三次尝试均失败"
          exit 1

      - name: 数据健康检查
        run: python scripts/check_data.py

      - name: 生成站点时间戳
        run: |
          echo "build: $(date -u '+%Y-%m-%d %H:%M UTC')" > web/BUILD.txt
          cat web/BUILD.txt

      - name: 发布到 gh-pages
        run: |
          set -e
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r web/. /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q
          git checkout -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u '+%Y-%m-%d')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: 失败时告警
        if: failure()
        run: |
          echo "::error::数据更新失败，站点仍保留上一次成功发布的内容。"
